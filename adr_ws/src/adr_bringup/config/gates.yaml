# 십자 배치 4게이트 원형 코스 — 코스 정의의 단일 진실 원천.
#   - adr_planning/gate_planner 가 읽어 웨이포인트를 만들고
#   - adr_sim/scripts/gen_world.py 가 읽어 worlds/adr_cross.sdf 를 생성하며
#   - adr_bringup/gate_markers 가 읽어 rviz 마커를 그린다.
# 이 파일을 바꾸면 반드시 gen_world.py 를 다시 돌려 월드를 갱신할 것.
#
# 좌표계: ENU(map), 단위 m / deg.
# yaw_deg: 게이트 통과 방향(개구부 법선)의 방위각. +x 기준 **CCW(위에서 봤을 때 반시계)**.
#          → 통과 방향 = (cos(yaw), sin(yaw)).
#          ⚠️ crazyflie 레포 gates.yaml 은 CW 관례였음 — 여기서는 ROS 표준(CCW)을 따른다.
course:
  radius: 4.0 # 게이트 중심이 놓인 원의 반지름
  height: 1.5 # 게이트 중심 높이
  direction: ccw # 비행 방향(위에서 봤을 때)
gate:
  inner_size: 1.5 # 개구부 한 변
  outer_size: 2.1 # 프레임 바깥 한 변 (→ 프레임 폭 0.3)
  thickness: 0.05 # 프레임 두께(통과 방향)
# 이륙 지점(바닥). 게이트1 앞 원호 위 — 이륙 후 takeoff_z 로 호버한 뒤 코스를 시작한다.
# 시뮬 월드의 adr_racer 스폰 위치도 gen_world.py 가 여기서 가져간다.
start:
  x: 2.83
  y: -2.83
  takeoff_z: 1.5
gates:
  - { id: 1, x: 4.0, y: 0.0, z: 1.5, yaw_deg: 90 }
  - { id: 2, x: 0.0, y: 4.0, z: 1.5, yaw_deg: 180 }
  - { id: 3, x: -4.0, y: 0.0, z: 1.5, yaw_deg: 270 }
  - { id: 4, x: 0.0, y: -4.0, z: 1.5, yaw_deg: 0 }
