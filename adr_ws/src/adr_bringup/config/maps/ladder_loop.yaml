# 맵: ladder + inverted loop (map:=ladder_loop) — 논문 Figure 4·5 / Table IV "Ladder loop"
#
# 논문의 시뮬레이션 결과가 나온 코스. track.py 의 LADDER_INVERTED_LOOP 를 NED→ENU 변환.
# inverted_loop 와 실제 게이트는 같고, 게이트 1 에 ladder(360° 좌선회 후 되돌아오기)가 붙는다.
#
# ⚠️ **step1 으로는 비행 불가** (ladder + split-S). 자세한 내용은 inverted_loop.yaml 주석 참고.
course:
  source: SkyDreamer track.py      # 참고용 메타 (코드는 gates/start/gate 만 읽는다)
  frame_note: NED→ENU 변환됨 (x_enu = y_ned, y_enu = x_ned, z_enu = -z_ned, yaw_enu = 90° - yaw_ned)
gate:
  inner_size: 1.5
  outer_size: 2.7              # 논문의 주황 게이트 (프레임 폭 0.6 m)
  thickness: 0.05                  # 물리 프레임 두께. 논문의 t_g(보상용 충돌 볼륨)와는 다른 값이다
# 이륙 지점 = 게이트 1 앞 3 m (논문 Table III: "게이트 앞 2~4 m 에서 출발")
start:
  x: -3.00
  y: 3.00
  takeoff_z: 1.35
gates:
  # 1. 게이트 1
  - { id: 1, x: 0.00, y: 3.00, z: 1.35, yaw_deg: 0 }
  # 2. (논문 가상) ladder — 360° 좌선회를 좁게 묶는 옆·위 점
  - { id: 2, x: 1.00, y: 4.00, z: 2.55, yaw_deg: 180 }
  # 3. (논문 가상) ladder — 게이트 1 위로 되돌아오는 점
  - { id: 3, x: 0.00, y: 2.00, z: 1.95, yaw_deg: 0 }
  # 4. (논문 가상) 게이트 2 위 2.7 m (inverted loop 진입)
  - { id: 4, x: 0.00, y: -2.00, z: 4.05, yaw_deg: 180 }
  # 5. 게이트 2 — split-S
  - { id: 5, x: 0.00, y: -2.00, z: 1.35, yaw_deg: 0 }
