# 맵: A2RL / MonoRace M16 (map:=a2rl_monorace)
#
# ─────────────────────────────────────────────────────────────────────────────
# 출처
#   * 게이트 평면 위치·통과 방향 : MonoRace (arXiv 2601.15222) **Fig. 2B** 의
#     M16 트랙 top view. 논문이 좌표표를 공개하지 않아 그림 픽셀에서 읽어
#     미터로 환산한 **재구성**이다 (사용자 측정값).
#   * t4 더블 게이트       : **Fig. 1B** 의 split-S 사진. 한 프레임에 구멍이
#     위아래 두 개 뚫린 형태로, 위 구멍을 +x 로 지나 뒤집어 아래 구멍을 -x 로
#     되돌아 나온다.
#
# 가정 (논문에 수치가 없어 추정한 값 — 바꿀 때 여기부터 본다)
#   a. **높이 z 는 전부 추정이다.** 논문은 게이트 고도를 싣지 않았다.
#      일반 게이트 1.4 m, t4 위 구멍 5.0 m 로 둔다 (Fig. 1B 의 사람 키 대비).
#   b. 게이트 크기(내경 1.5 / 외경 2.7 / 두께 0.05)는 big_track 과 동일한
#      A2RL 규격 게이트로 본다. 논문 Fig. 2B 에서 치수를 읽을 수 없다.
#   c. 가상 게이트 없음 — 11 개 전부 실물 프레임이다.
#   d. 시작점 (8, -22)_fig 는 t0 앞 ~4 m 지점으로 잡은 값이다.
#
# 좌표 변환 (big_track.yaml 과 **같은 규칙**)
#   Fig. 2B 의 (x, y) 를 MAVLab NED 평면으로 보고 ENU 로 돌린다.
#       x_enu = y_fig,  y_enu = x_fig,  yaw_enu = 90° - yaw_fig
#   z 는 그림에 없으므로 위의 가정 (a) 를 그대로 쓴다 (이미 상향 양수).
#   변환 검증용 원본 대조 그림: maps/a2rl_convert_check.png
#
# 그림 좌표 원표 (변환 전)
#     #   name       x_fig  y_fig  yaw_fig   z
#     1   t0          14    -25     -35     1.4
#     2   t1          30    -19     +15     1.4
#     3   t2          46    -22     -10     1.4
#     4   t3          63    -20       0     1.4
#     5   t4_upper    85    -18       0     5.0   ← 더블 게이트 위 구멍 (+x 통과)
#     6   t4_lower    85    -18     180     1.4   ← 같은 프레임 아래 구멍 (-x 통과)
#     7   t5          68    -13     165     1.4
#     8   t6          55     -7     180     1.4
#     9   t7          37    -12     180     1.4
#    10   t8          19     -7     180     1.4
#    11   t9           9    -14     -90     1.4
#   start              8    -22       -     1.4
#
# 한 바퀴 = 위 11 개를 순서대로 통과한 뒤 t0 를 다시 지나는 것 (loop: true).
course:
  source: MonoRace arXiv 2601.15222 Fig. 2B (M16 top view) + Fig. 1B (t4 split-S)
  frame_note: >-
    NED(그림)→ENU 변환됨. x_enu = y_fig, y_enu = x_fig, yaw_enu = 90° - yaw_fig.
    z 는 논문 미공개 → 추정값 (일반 1.4 m, t4 위 구멍 5.0 m).
  loop: true
gate:
  inner_size: 1.5
  outer_size: 2.7
  thickness: 0.05
start:
  x: -22.00          # = y_fig  -22
  y: 8.00            # = x_fig    8
  takeoff_z: 1.40
gates:
  # id, ENU x/y/z, yaw_deg(ENU) = 90 - yaw_fig
  - { id: 1,  name: t0,       x: -25.00, y: 14.00, z: 1.40, yaw_deg: 125 }
  - { id: 2,  name: t1,       x: -19.00, y: 30.00, z: 1.40, yaw_deg:  75 }
  - { id: 3,  name: t2,       x: -22.00, y: 46.00, z: 1.40, yaw_deg: 100 }
  - { id: 4,  name: t3,       x: -20.00, y: 63.00, z: 1.40, yaw_deg:  90 }
  # t4 더블 게이트 — 아래 두 줄은 **같은 물리 프레임**의 두 구멍이다.
  - { id: 5,  name: t4_upper, x: -18.00, y: 85.00, z: 5.00, yaw_deg:  90, panel: t4 }
  - { id: 6,  name: t4_lower, x: -18.00, y: 85.00, z: 1.40, yaw_deg: 270, panel: t4 }
  - { id: 7,  name: t5,       x: -13.00, y: 68.00, z: 1.40, yaw_deg: 285 }
  - { id: 8,  name: t6,       x:  -7.00, y: 55.00, z: 1.40, yaw_deg: 270 }
  - { id: 9,  name: t7,       x: -12.00, y: 37.00, z: 1.40, yaw_deg: 270 }
  - { id: 10, name: t8,       x:  -7.00, y: 19.00, z: 1.40, yaw_deg: 270 }
  - { id: 11, name: t9,       x: -14.00, y:  9.00, z: 1.40, yaw_deg: 180 }

# ───────────────────────────── 특수 프레임 (충돌·렌더 모두 이 모양을 쓴다)
#
# 기본 게이트는 "외경 2.7 정사각 판 - 내경 1.5 정사각 구멍" 이다. t4 는 그게
# 아니라 바닥까지 내려오는 **세로로 긴 한 장의 판**에 구멍이 둘 뚫려 있고,
# 두 구멍 사이의 가운데 판도 실물이다 (= 부딪히면 충돌).
#
#   width  2.7            판의 가로폭 (게이트 로컬 y, ±1.35)
#   z      0 ~ 6.35       = 위 구멍 중심 5.0 + 내경 절반 0.75 + 프레임 폭 0.6
#   holes  z=1.40, z=5.00 각각 한 변 1.5 의 정사각 구멍
panels:
  t4:
    width: 2.7
    z_lo: 0.00
    z_hi: 6.35
    holes:
      - { z: 1.40, size: 1.5 }
      - { z: 5.00, size: 1.5 }

# ───────────────────────────── 월드 경계 (track.RacingTrack 인자로 넘길 값)
#   수평 = (게이트 + 시작점 + extra_xy) 바운딩 박스 + 3 m
#   바닥 0, 천장 = 기준 궤적 최대 고도 + 1.5 m, 최소 8 m
#        → 기준 궤적 최대 고도 5.08 m 이므로 하한인 8.0 m 를 쓴다.
#
#   extra_xy 는 게이트가 아니지만 코스에 들어가야 하는 점이다. 여기엔 t4
#   split-S 선회 웨이포인트 (x_fig 92 → y_enu 92) 하나가 들어간다. 이게 없으면
#   게이트 바운딩 박스 상한이 y_enu 88 이라 기준 궤적(최대 y 92.01)이 경계를
#   뚫는다. 검증: racing_env/a2rl.py `ref`.
world:
  bounds_margin: 3.0
  extra_xy:
    - [-18.0, 92.0]     # t4 선회 웨이포인트 (ENU x,y)
  z_min: 0.0
  z_max: 8.0
  virtual_gate_ids: []

# ───────────────────────────── 기준 궤적 (확정값, racing_env/a2rl.py ref)
#   방식      : 게이트 전/후 ±1.5 m + 주기 min_snap, yaw 는 속도 방향
#   t4 선회 wp: 그림 (92.0, -18) → ENU (-18, 92), z 3.2
#               사용자 제안 x_fig 88~89 는 바닥을 뚫어서 더 뒤로 물렸다
#               (88.0 → z_min -1.50 / 88.5 → -0.68 / 89.0 → -0.09 / 92.0 → +1.13)
#   채택      : v_avg 4.0, a_max 6.0  (v_avg 3.0 도 한계 안이지만 더 느리다.
#               a_max 를 풀면 v_avg 4.0 이 주기 45.99 s 까지 빨라지지만
#               요레이트 |r| 9.14 > 7 로 한계를 넘는다)
#   결과      : 주기 56.57 s, 평균 3.36 / 최대 4.41 m/s,
#               TWR 1.19/4.0, 틸트 31.7°, 레이트 [0.32,0.78,6.47]/[10,10,7],
#               고도 [1.13, 5.08] m
