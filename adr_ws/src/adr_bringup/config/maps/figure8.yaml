# 맵: 평면 8자 코스 (map:=figure8), 게이트 6개 모두 중심 높이 1.5 m.
# x=6 sin(t), y=3 sin(2t)의 양쪽 루프를 따라 배치한다.
# 순서: 왼쪽 아래 → 오른쪽 위 → 오른쪽 끝 → 오른쪽 아래 → 왼쪽 위 → 왼쪽 끝.
# 1→2와 4→5가 중앙에서 교차한다. 중앙에는 게이트를 두지 않는다.
# yaw는 곡선 접선 방향. ENU 좌표, +x 기준 CCW, 단위 m / deg.
course:
  shape: figure8
  layout: planar_lemniscate
  width: 12
  depth: 6
  height: 1.5
gate:
  inner_size: 1.5
  outer_size: 2.1
  thickness: 0.05
# 첫 게이트 앞 3 m에서 출발, 이륙/복귀 구간은 레이싱 루프와 별도.
start:
  x: -7.242641
  y: -3.0
  takeoff_z: 1.5
gates:
  - { id: 1, x: -4.242641, y: -3.0, z: 1.5, yaw_deg: 0 }
  - { id: 2, x:  4.242641, y:  3.0, z: 1.5, yaw_deg: 0 }
  - { id: 3, x:  6.000000, y:  0.0, z: 1.5, yaw_deg: -90 }
  - { id: 4, x:  4.242641, y: -3.0, z: 1.5, yaw_deg: 180 }
  - { id: 5, x: -4.242641, y:  3.0, z: 1.5, yaw_deg: 180 }
  - { id: 6, x: -6.000000, y:  0.0, z: 1.5, yaw_deg: -90 }
