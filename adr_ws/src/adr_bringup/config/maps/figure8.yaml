# 맵: 8자 코스 (map:=figure8) — 원점에서 한 번 교차하는 레미니스케이트.
#
# x = 5·cos t,  y = 2.5·sin 2t  를 t = 22.5, 67.5, 112.5, 157.5, 202.5, 247.5, 292.5, 337.5° 에서 샘플링했고
# yaw_deg 는 그 점의 **접선 방향**이다(그래서 게이트를 자연스럽게 지나간다).
# 교차점(t = 90°, 270°) 에는 게이트를 두지 않는다 — 같은 지점을 서로 다른 방향으로 두 번 지나므로.
#
# 스키마·규약은 maps/cross.yaml 주석 참고 (ENU, yaw_deg 는 +x 기준 CCW 통과 방향).
course:
  shape: figure8       # 참고용 메타 (코드는 gates/start/gate 만 읽는다)
  a: 5
  b: 2.5
  height: 1.5
gate:
  inner_size: 1.5
  outer_size: 2.1
  thickness: 0.05
# 이륙 지점 = 곡선의 t=0 점 (게이트1 바로 앞)
start:
  x: 5.00
  y: 0.0
  takeoff_z: 1.5
gates:
  - { id: 1, x: 4.62, y: 1.77, z: 1.5, yaw_deg: 118.4 }
  - { id: 2, x: 1.91, y: 1.77, z: 1.5, yaw_deg: 217.4 }
  - { id: 3, x: -1.91, y: -1.77, z: 1.5, yaw_deg: 217.4 }
  - { id: 4, x: -4.62, y: -1.77, z: 1.5, yaw_deg: 118.4 }
  - { id: 5, x: -4.62, y: 1.77, z: 1.5, yaw_deg: 61.6 }
  - { id: 6, x: -1.91, y: 1.77, z: 1.5, yaw_deg: 322.6 }
  - { id: 7, x: 1.91, y: -1.77, z: 1.5, yaw_deg: 322.6 }
  - { id: 8, x: 4.62, y: -1.77, z: 1.5, yaw_deg: 61.6 }
