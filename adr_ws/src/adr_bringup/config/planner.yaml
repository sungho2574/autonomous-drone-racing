gate_planner:
  ros__parameters:
    gates_file: ""        # 비우면 config/maps/cross.yaml (launch 가 map:= 로 채운다)
    laps: 2               # 코스 반복 횟수
    approach_dist: 0.8    # 게이트 앞뒤 오프셋 점 거리 [m] (0 이면 중심만)
    v_avg: 3.0            # 시간 할당용 평균 속도 [m/s]
    v_max: 6.0            # 초과 시 전체 시간 스케일
    a_max: 8.0
    t_min: 0.3            # 세그먼트 최소 시간 [s]
    end_at_start: true    # 마지막에 이륙 호버점으로 복귀
    path_dt: 0.05         # rviz Path 샘플 간격 [s]
    frame_id: map
    # Spec §3.2: offline gate-bearing heading overlay; gate_normal restores old yaw.
    heading_mode: perception_aware
    heading_d_min: 1.0
    heading_d_max: 8.0
    heading_lambda_g: 0.95
    heading_sample_dt: 0.1
    heading_smoothing_time: 0.3
    heading_max_rate_deg: 0.0     # 0: 제한 없음, yaw 때문에 전체 감속하지 않음
    heading_max_accel_deg: 0.0    # 0: 제한 없음
    heading_center_tolerance_deg: 10.0
    # Match adr_sim/config/racer_spec.yaml camera (real camera: use calibration).
    heading_hfov_deg: 90.0
    heading_camera_width: 640
    heading_camera_height: 480
    heading_camera_tilt_deg: 20.0
    heading_camera_xyz: [0.045, 0.0, 0.022]
