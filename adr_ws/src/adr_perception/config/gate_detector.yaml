gate_detector:
  ros__parameters:
    image_topic: /adr/camera/image_raw
    hsv_lower: [3, 100, 60]       # OpenCV HSV (H 0~179). sim 게이트 주황(1.0,0.45,0) 기준
    hsv_upper: [25, 255, 255]
    min_area: 150.0               # 프레임 픽셀 면적 하한
    min_hole_area: 30.0           # 개구부 하한
    morph_kernel: 3
    max_gates: 4
    # 보수적인 영상 평행사변형 필터. 강한 원근의 정상 게이트도 제외될 수 있음.
    max_parallel_angle_deg: 8.0        # 양쪽 대변 쌍 각각의 방향 차이 [deg]
    max_opposite_length_error: 0.20    # 양쪽 대변 쌍 각각 |a-b|/max(a,b)
    debug_topic: /adr/perception/debug_image
    mask_topic: /adr/perception/mask_image   # HSV 세그멘테이션 마스크 (mono8). 구독자 있을 때만 발행
