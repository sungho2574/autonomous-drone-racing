# 월드 배경(바닥 텍스처 + 장애물). 비행 코스(gates.yaml)와는 무관하며,
# 목적은 **VIO/인식이 쓸 시각적 특징을 만드는 것**이다.
# 기본 월드는 무늬 없는 바닥 + 게이트 4개뿐이라 KLT 로 추적할 코너가 거의 없어 VIO 가 바로 발산한다.
# 값을 바꾸면 adr_sim/scripts/gen_world.py 를 다시 돌린다 (텍스처 PNG 도 여기서 만들어진다).
#
# 카메라가 20° 위를 보므로 화면 아래쪽에만 바닥이 보인다(고도 1.5 m 에서 약 5 m 앞부터).
# 그래서 **세로로 선 기둥**이 코너 공급원으로 가장 효율이 좋다.
ground:
  size: 60.0          # 텍스처 바닥 한 변 [m]
  thickness: 0.1
  texture_px: 512     # PNG 한 변 [px]
  tile_px: 8          # 타일 한 변 [px] — 60 m / (512/8) = 0.94 m 격자
  gray: [70, 190]     # 타일 밝기 범위
  tint: 12            # 타일마다 RGB 에 주는 색 편차
  grout: 0.75         # 타일 경계선 밝기 배율 (1 이면 경계선 없음)
# 코스 바깥에만 둔다: 반지름 4 m + 게이트 반폭 1.05 m + 여유
poles:
  count: 12
  radius: [6.5, 7.5]  # 배치 반지름 범위 [m]
  height: [2.0, 4.0]
  thickness: 0.12
boxes:
  count: 10
  radius: [8.0, 12.0]
  size: [0.4, 1.6]    # 가로·세로 [m]
  height: [0.5, 2.5]
seed: 0               # 배치·색·텍스처 난수 시드 (바꾸면 배경이 통째로 달라진다)
