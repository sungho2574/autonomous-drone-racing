%YAML:1.0
# OpenVINS(ov_msckf) 설정 — 250급 레이싱 드론 sim(단안 30 Hz + IMU 250 Hz) 기준.
# 캘리브레이션 값은 gen_ov_config.py 가 racer_spec.yaml 에서 만든 아래 두 파일에 있다.
#
# 튜닝 메모
#   - sim 은 캘리브레이션이 정확하므로 calib_* 를 모두 끈다(추정 상태가 줄어 빠르고 안정적).
#     실기체로 가면 calib_cam_timeoffset·extrinsics 부터 켜는 게 보통이다.
#   - 초기화는 static: 기체가 멈춰 있다가 이륙하는 순간을 잡아 중력 정렬로 시작한다.
#     이륙 전 정지 구간이 init_window_time 보다 짧으면 초기화가 안 된다.
#   - track_frequency 는 영상 처리 상한. 소프트웨어 렌더링 VM 이면 15~20 으로 낮춘다.

verbosity: "INFO"
use_fej: true
integration: "rk4"
use_stereo: false
max_cameras: 1

calib_cam_extrinsics: false
calib_cam_intrinsics: false
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.8            # 월드 SDF 의 <gravity>0 0 -9.8</gravity> 과 일치시킬 것

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: false
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: false

init_window_time: 1.0       # 이륙 직전 정지 구간에서 이만큼을 초기화에 쓴다 [s]
init_imu_thresh: 1.0        # 이 이상 가속도 분산이 튀면 '움직이기 시작'으로 보고 초기화 확정
init_max_disparity: 10.0
init_max_features: 50

use_klt: true
num_pts: 200
fast_threshold: 15          # 게이트/바닥 텍스처가 빈약한 합성 장면이라 기본 20 보다 낮춤
grid_x: 5
grid_y: 5
min_px_dist: 8
knn_ratio: 0.70
track_frequency: 20.0
downsample_cameras: false
num_opencv_threads: 2
# true(업스트림 기본)여도 동작은 한다. false 로 두는 건 취향이 아니라 종료 안정성 때문 —
# true 면 ROS2Visualizer 생성자가 **detach** 된 스레드를 띄워 while(rclcpp::ok()) 로 20 Hz 씩
# publish_images() 를 도는데, 이 스레드는 Visualizer 객체보다 오래 살 수 있어 종료 시 이미 파괴된
# 퍼블리셔를 건드릴 여지가 있다. false 면 영상 콜백 안에서 직접 발행해 그 스레드가 아예 안 생긴다.
# (디버그 영상은 구독자가 있을 때만 그리므로 평소 비용도 0 이다.)
multi_threading_pubs: false
histogram_method: "HISTOGRAM"

up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"

# ---- 아래는 OpenVINS v2.7 이 필수로 요구하는 키들 ----
# 빠지면 opencv_yaml_parse 가 "the node X of type [..] was not found" 를 찍고
# parser->successful() 이 false 가 되어 run_subscribe_msckf.cpp:97 에서 std::exit(EXIT_FAILURE) 한다.
# (그 과정에서 소멸자가 죽은 rclcpp 컨텍스트를 건드려 SIGSEGV 로 보이므로 원인 찾기가 까다롭다.)
# 값은 전부 OpenVINS 기본값 그대로 — 채워 넣기 전 실효 동작과 동일하다.

# ArUco (안 쓴다)
use_aruco: false
num_aruco: 1024
downsize_aruco: true

# 특징점 삼각측량 (ov_core FeatureInitializerOptions 기본값)
fi_triangulate_1d: false
fi_refine_features: true
fi_max_runs: 5
fi_init_lamda: 1e-3
fi_max_lamda: 1e10
fi_min_dx: 1e-6
fi_min_dcost: 1e-6
fi_lam_mult: 10.0
fi_min_dist: 0.10
fi_max_dist: 60.0
fi_max_baseline: 40.0
fi_max_cond_number: 10000.0

# 동적 초기화 (안 쓴다 — 이 코스는 정지 상태에서 이륙하므로 static init)
init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_threads: 6
init_dyn_mle_max_time: 0.05
init_dyn_num_pose: 6
init_dyn_min_deg: 20.0
init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-20
init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

# 기타
multi_threading_subs: true
record_timing_information: false
record_timing_filepath: "/tmp/traj_timing.txt"
