sim:
  device: cpu
  policy_device: cuda:0
  integrator: rk4
  aero: true
  policy_hz: 50.0
  physics_dt: 0.01
  substeps: 2
  episode_sec: 32.0
  dtype_policy: float32
airframe:
  spec_yaml: adr/adr_ws/src/adr_sim/config/racer_spec.yaml
  k_w: 30.0
  frame_drag: 0.01
  mass_nominal: 0.8
track:
  map_yaml: maps/gate_map.yaml
  virtual_gate_ids: []
  start:
    x: -2.0
    y: -2.8
    takeoff_z: 0.75
  gate_thickness: 0.05
  inflate: 0.18
  wall_clear: 0.18
  bounds_margin: 3.0
  z_min: 0.0
  z_max: 8.0
  loop: true
action:
  a_max_g: 4.0
  max_body_rate:
  - 10.0
  - 10.0
  - 7.0
reward:
  terms:
    r_prog:
      lambda: 1.0
      clip: 0.12
    r_gate:
      lambda: 10.0
    p_rate:
      lambda: 0.005
    p_offset:
      lambda: 0.0
    p_perc:
      lambda: 0.02
      theta_max_deg: 60.0
      camera_uptilt_deg:
      - 40.0
      - 50.0
    p_slip:
      lambda: 0.02
      min_speed: 1.0
    p_delta_u:
      lambda: 0.05
      thresh:
      - 0.05
      - 0.1
      - 0.1
      - 0.1
    p_u:
      lambda: 0.05
      min_ratio: 0.34
    p_crash:
      lambda: 10.0
eval:
  split_gates:
  - 2
  - 3
obs:
  delay_steps_max: 2
  delay_enabled: false
  pos_noise_std: 0.02
  noise_enabled: false
init:
  hover_start_prob: 1.0
  reference:
    pre_post: 1.5
    v_avg: 2.0
    a_max: 6.0
    yaw_v_min: 1.5
    yaw_smooth: 0.15
    samples: 4000
    wp_shift:
      5:
      - 0.0
      - -1.0
      - 0.0
      6:
      - 0.0
      - -1.0
      - 0.0
      8:
      - 0.0
      - 0.0
      - 0.2
      9:
      - 0.0
      - 0.0
      - 0.2
    turn_v5:
      enabled: true
      gate_in: 2
      gate_out: 3
      side: 1.0
      R: 0.45
      wf: 0.5
      nw: 12
      z_profile: lin
      brake: 0.351927
      brake_mode: bstar
      wp_mode: s3
      mode: snap
      ts: 1.1
      pin_a: false
      nt: 0
    extra:
    - after_gate: 4
      x: 1.8
      y: -2.99
      z: 0.75
    - after_gate: 4
      x: 0.0
      y: -3.2
      z: 0.75
    - after_gate: 4
      x: -1.8
      y: -2.99
      z: 0.75
  frontier:
  - after_gate: 2
    frac: 0.25
    span_sec: 1.6
    lead_sec: 0.2
  - after_gate: 4
    frac: 0.1
    span_sec: 2.0
    lead_sec: 0.3
  gate_plane_clear: 0.3
  pos_noise: 0.5
  vel_dir_noise_deg: 15.0
  speed_scale:
  - 0.6
  - 1.2
  att_noise_deg: 10.0
  body_rate_max: 0.5
  rotor_at_hover: true
domain_randomization:
  enabled: true
  vectorized: true
  use_update_vehicle_params: true
  randomize_inertia: true
  randomize_drag: true
  randomize_kw: true
  kw_range:
  - 20.0
  - 50.0
ppo:
  policy: MlpPolicy
  net_arch:
  - 64
  - 64
  learning_rate: 0.0003
  gamma: 0.999
  gae_lambda: 0.95
  clip_range: 0.2
  n_epochs: 10
  vf_coef: 0.5
  max_grad_norm: 0.5
  ent_coef: 0.0
  log_std_init: -2.0
  num_envs: 2048
  n_steps: 64
  batch_size: 4096
  torch_threads: 2
